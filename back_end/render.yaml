services:
  - type: web
    name: wtt-backend
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
    autoDeploy: true

databases:
  - name: wtt-postgres
    databaseName: wtt_db
    user: postgres
